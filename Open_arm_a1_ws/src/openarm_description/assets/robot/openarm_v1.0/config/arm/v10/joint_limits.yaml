# Joint limits for Open Arm A1 v10
# These are placeholder values — replace with actual motor spec limits!
#
# Schema expected by openarm_macro.xacro:
#   jointN:
#     limit:
#       lower: <rad>
#       upper: <rad>
#       effort: <Nm>
#       velocity: <rad/s>

joint1:
  limit:
    lower: -1.396263
    upper: 3.490659
    effort: 87.0
    velocity: 2.175

joint2:
  limit:
    lower: -1.745329
    upper: 1.745329
    effort: 87.0
    velocity: 2.175

joint3:
  limit:
    lower: -1.570796
    upper: 1.570796
    effort: 87.0
    velocity: 2.175

joint4:
  limit:
    # Small negative margin (not the real 0.0 mechanical stop) - MoveIt
    # Jazzy's CheckStartStateBounds adapter has zero tolerance (the
    # start_state_max_bounds_error param used in older MoveIt versions was
    # removed - confirmed via `strings` on
    # libmoveit_default_planning_request_adapter_plugins.so, no longer
    # referenced), so real encoder noise at the exact lower limit (e.g.
    # -0.0002 rad) gets rejected as "start state out of bounds" even though
    # the joint is physically fine. This margin absorbs that noise; it does
    # not change the motor's actual/firmware safety limit.
    lower: -0.02
    upper: 2.443461
    effort: 87.0
    velocity: 2.175

