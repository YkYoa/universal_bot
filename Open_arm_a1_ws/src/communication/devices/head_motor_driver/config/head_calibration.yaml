# Real measured calibration, ported from robot-healthmate's
# hardware/hand-arm-head/firmware/head_neck/python/calibration_servo0.json
# (pan) and calibration_servo1.json (tilt). See NETWORK_PROTOCOL.md in that
# repo for how these fits were derived (PWM sweep + hand-measured ground
# truth ADC readings).
#
# center_deg is the absolute servo angle (in the calibration's own 0-270ish
# degree frame) that this driver treats as "0 rad" on the ROS/UDS side.
# Currently set to the midpoint of each joint's safe reachable PWM range -
# NOT yet verified against the real physical "camera pointing straight
# forward and level" reference per HEAD_DRIVER_SPEC.md section 5. Adjust
# this value once that's been checked against the actual head assembly.
#
# min_angle_rad/max_angle_rad match the URDF's actual joint limits
# (openarm_description/urdf/body/openarm_body.xacro: both neck_joint and
# head_joint are +-1.0472 rad / +-60deg), not HEAD_DRIVER_SPEC.md's
# placeholder values.
#
# pwm_min_us/pwm_max_us are this channel's empirically-found safe range -
# outside it the servo's own signal decoder ignores the PWM entirely (see
# NETWORK_PROTOCOL.md's "known hardware notes"), it is not a soft/arbitrary
# limit.

pan:  # channel 0 - confirmed neck_joint (pan).
  adc_min: 669           # raw ADC at min_angle_rad (informational only, not used in conversion math)
  adc_max: 3483          # raw ADC at max_angle_rad (informational only, not used in conversion math)
  min_angle_rad: -1.0472
  max_angle_rad: 1.0472
  pwm_min_us: 500
  pwm_max_us: 2520
  invert: false
  # center_deg/pwm_to_deg_intercept re-derived 2026-08-16 from a real
  # measured reference point: PWM=959us is the true home position, at
  # absolute servo angle 90deg. Slope kept as-is (PWM-per-degree scale
  # factor, not re-measured); intercept solved so this one point lies
  # exactly on the line: intercept = center_deg - pwm_target*slope.
  center_deg: 90.0
  pwm_to_deg_slope: 0.11035055741866533
  pwm_to_deg_intercept: -15.826184564500053
  adc_to_deg_slope: 0.06395635853117716
  adc_to_deg_intercept: -2.1064436012111107
  # Trapezoidal rate-limiter for the commanded angle (see motion_profile.hpp)
  # - keep well under the servo's real no-load speed so it never falls
  # behind the profile and looks like a stall.
  max_velocity_rad_s: 3.0
  max_accel_rad_s2: 8.0
  # points: [] - populated by auto_calibrate.py (multi-point ADC->degree
  # lookup table). Absent = falls back to the linear adc_to_deg_slope/
  # intercept fit above. Run: python3 auto_calibrate.py --joint pan
