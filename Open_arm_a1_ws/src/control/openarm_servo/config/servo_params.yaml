# -----------------------------------------------------------------------------
# servo_params.yaml
#
# Shared moveit_servo config for both arms. servo.launch.py loads this once
# per arm and overrides move_group_name/command_out_topic on top of it (see
# that file) - the two arms are kinematically identical (same v10 arm
# repeated), so duplicating this whole file per side would just be two
# copies that drift out of sync over time.
#
# Schema/field names come from the real installed package
# (/opt/ros/jazzy/share/moveit_servo/config/panda_simulated_config.yaml on
# IQ9075, moveit_servo 2.12.4) - copied from there rather than written from
# memory, since a wrong field name here fails silently (unused, not an
# error) rather than loudly.
# -----------------------------------------------------------------------------

## Properties of outgoing commands
publish_period: 0.034  # 1 / ~30 Hz
max_expected_latency: 0.1

command_in_type: "unitless"  # [-1:1], as if from a joystick/gesture input

# Reasoned from this robot's own real data, not Panda's: joint_limits.yaml's
# actual openarm_*_joint1-7 max_velocity is 2.175 rad/s (joints 1-4) / 2.61
# rad/s (joints 5-7), and planner_profiles.yaml's own production profiles
# run real hardware moves at 0.3-0.5 of that (fast_ptp/safe_rrt: 0.4-0.5;
# linear_approach/circular_move, its most conservative profiles: 0.3).
# Servo has no offline collision-checked path ahead of it the way a
# planned move does - a human/gesture is reacting live - so these start at
# or below that existing conservative end, deliberately not matched to the
# 0.4-0.5 used for planned, pre-validated moves.
#
# NOT validated against the real arm's actual reach/payload/link geometry
# (undocumented in this repo, so scale.linear/rotational below are a
# reasoned starting point, not a measured one) - test well below these
# with servo_keyboard_input before trusting them under gesture/joystick
# input, and tune from there.
scale:
  linear: 0.15      # m/s
  rotational: 0.5   # rad/s
  joint: 0.5        # rad/s - well under every joint's real max_velocity (2.175/2.61)

command_out_type: trajectory_msgs/JointTrajectory
publish_joint_positions: true
publish_joint_velocities: true
publish_joint_accelerations: false

use_smoothing: true
smoothing_filter_plugin_name: "online_signal_smoothing::AccelerationLimitedPlugin"

# move_group already runs as the primary planning scene monitor for this
# workspace (moveit_bimanual.launch.py's move_group_node) when it's up -
# false here so this Servo instance doesn't also try to own
# /get_planning_scene.
is_primary_planning_scene_monitor: false
check_octomap_collisions: false

## Configure handling of singularities and joint limits
# moveit_servo's own generic defaults (dimensionless Jacobian-condition-
# number / radian thresholds, not really Panda-specific) kept as-is - real
# per-robot tuning here needs live singularity testing (watch the
# condition number servo_keyboard_input logs near a wrist singularity)
# this session didn't have hardware time for, not just arithmetic from
# joint_limits.yaml.
lower_singularity_threshold: 10.0
hard_stop_singularity_threshold: 30.0
leaving_singularity_threshold_multiplier: 2.0
joint_limit_margins: [0.12]

## Topic names (relative - servo.launch.py namespaces each instance, e.g.
## /left_arm_servo/delta_twist_cmds, so left/right never collide)
cartesian_command_in_topic: ~/delta_twist_cmds
joint_command_in_topic: ~/delta_joint_cmds
joint_topic: /joint_states
status_topic: ~/status
# command_out_topic and move_group_name are NOT set here - servo.launch.py
# supplies them per-arm on top of this file.

## Collision checking for the entire robot body
# Same "kept as generic defaults" reasoning as the singularity thresholds
# above - real per-robot tuning needs this robot's actual link geometry,
# not available in this repo.
check_collisions: true
collision_check_rate: 10.0
self_collision_proximity_threshold: 0.01
scene_collision_proximity_threshold: 0.02
