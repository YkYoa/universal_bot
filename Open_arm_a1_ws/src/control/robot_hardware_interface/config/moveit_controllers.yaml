/**:
  ros__parameters:
    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    moveit_simple_controller_manager:
      controller_names:
        - left_arm_controller
        - right_arm_controller
        - left_gripper_controller
        - right_gripper_controller
        - left_hand_j1_controller
        - left_hand_j2_controller
        - right_hand_j1_controller
        - right_hand_j2_controller
        - left_hand_rotate_controller
        - right_hand_rotate_controller
        - head_controller

      left_arm_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_left_joint1
          - openarm_left_joint2
          - openarm_left_joint3
          - openarm_left_joint4
          - openarm_left_joint5
          - openarm_left_joint6
          - openarm_left_joint7

      right_arm_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_right_joint1
          - openarm_right_joint2
          - openarm_right_joint3
          - openarm_right_joint4
          - openarm_right_joint5
          - openarm_right_joint6
          - openarm_right_joint7

      left_gripper_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_left_finger_joint1
          - openarm_left_finger_joint2

      right_gripper_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_right_finger_joint1
          - openarm_right_finger_joint2

      # amazing_hand fingers (ee_type:=amazing_hand only; mutually exclusive
      # with the grippers above). MoveIt splits a left_hand_fingers/
      # right_hand_fingers group trajectory across the j1 (yaw) + j2 (flex)
      # controller pair for that side.
      left_hand_j1_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_left_j11
          - openarm_left_j12
          - openarm_left_j13
          - openarm_left_j14

      left_hand_j2_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_left_j21
          - openarm_left_j22
          - openarm_left_j23
          - openarm_left_j24

      right_hand_j1_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_right_j11
          - openarm_right_j12
          - openarm_right_j13
          - openarm_right_j14

      right_hand_j2_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_right_j21
          - openarm_right_j22
          - openarm_right_j23
          - openarm_right_j24

      # "Motor 8" repurposed for amazing_hand (ee_type:=amazing_hand only;
      # mutually exclusive with left_gripper_controller/right_gripper_controller
      # above - both claim openarm_<side>_finger_joint1, since it's the same
      # real CAN motor either way. load_moveit_controllers_for_ee_type()
      # (openarm_moveit_config/srdf_utils.py) strips whichever pair doesn't
      # apply to the current ee_type before this reaches move_group.
      left_hand_rotate_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_left_finger_joint1

      right_hand_rotate_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_right_finger_joint1

      # body v2 articulated neck + head (body_type:=v2 only)
      head_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - openarm_body_neck_joint
          - openarm_body_head_joint
