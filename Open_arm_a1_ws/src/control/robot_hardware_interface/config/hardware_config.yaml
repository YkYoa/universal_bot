# Real-hardware detection & port config, used by
# robot_hardware_interface/launch/bringup.launch.py.
#
# hardware_enable: 1 = real hardware, -1 = force fake (board/CAN not present).
# 1 is still auto-downgraded to fake if `interface` isn't actually up (cable
# unplugged, board unpowered, or CAN interface not brought up via
# openarm-can-configure-socketcan) - a stale hardware_enable=1 left over from
# a previous setup should never make ros2_control try to activate hardware
# that isn't really there.

hardware_enable:
  head: 0
  arms: 1

interfaces:
  head_ethernet: enp2s0   # host NIC wired to the STM32 board's W5500 module
  left_can: can1
  right_can: can0

# CAN-FD bitrate used when this launch brings left_can/right_can up itself
# (see bringup.launch.py's _ensure_can_up) - matches
# openarm-can-configure-socketcan-4-arms's own defaults.
can:
  bitrate: 1000000
  dbitrate: 5000000

head_board:
  ip: 192.168.10.101
  port: 9877       # SERVO/STATUS/RELEASE/STEPPER (head_motor_driver_node)
  led_port: 9878   # RGB/MODE/BRIGHTNESS (head_led_node)

control_mode: torque
position_mode_velocity: 1.0

shutdown:
  disable_retries: 3
  retry_delay_ms: 100
  home_timeout_ms: 3000
  home_tolerance: 0.05
