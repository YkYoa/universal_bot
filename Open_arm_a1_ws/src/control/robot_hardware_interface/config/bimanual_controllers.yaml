controller_manager:
  ros__parameters:
    update_rate: 100  # Hz (Giữ nguyên 100Hz từ cấu hình cũ của bạn)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Free-drive/hand-guiding (see gravity_compensation_controller package).
    # Only meaningful when control_mode: torque is set in hardware_config.yaml
    # - not auto-spawned by bringup.launch.py, load/activate explicitly
    # (`ros2 control load_controller` / `switch_controllers`) when wanted.
    # Writes 0 torque until you call its ~/enable service - see the plan's
    # staged real-hardware validation procedure before enabling.
    left_gravity_comp_controller:
      type: gravity_compensation_controller/GravityCompensationController

    right_gravity_comp_controller:
      type: gravity_compensation_controller/GravityCompensationController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # amazing_hand connector rotation ("motor 8" - the same real CAN motor
    # left_gripper_controller/right_gripper_controller drive on openarm_hand,
    # repurposed here to spin the whole hand via openarm_<side>_finger_joint1;
    # see amazing_hand_connector's joint comment in openarm_robot.xacro.
    # ee_type:=amazing_hand only.
    left_hand_rotate_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_hand_rotate_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # amazing_hand fingers (ee_type:=amazing_hand only)
    left_hand_j1_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_hand_j2_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_hand_j1_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_hand_j2_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # body v2 articulated neck + head (body_type:=v2 only)
    head_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # --- KHAI BÁO BASE CONTROLLER VÀO MANAGER ---
    base_controller:
      type: diff_drive_controller/DiffDriveController  

# ====================================================
# CẤU HÌNH CHI TIẾT CHO TỪNG CONTROLLER
# ====================================================

left_arm_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_gravity_comp_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    base_link: openarm_body_link0
    # hand_tcp (not link7) so the gripper's mass (0.35kg "hand" link, fixed-
    # jointed straight onto link7 - adds zero DOF to the KDL chain) is
    # included in the gravity model. Only valid when launched with
    # ee_type:=openarm_hand hand:=true (what this workspace normally runs) -
    # revert to openarm_left_link7 if launched without the gripper attached,
    # or on_configure() will fail to find this link in the URDF. Left/right
    # fingers (~0.036kg each) are NOT included - they're a side branch off
    # "hand", not on the direct base->tip path a KDL chain can follow.
    tip_link: openarm_left_hand_tcp
    ramp_duration_sec: 2.0

right_gravity_comp_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    base_link: openarm_body_link0
    # See left_gravity_comp_controller's tip_link comment above.
    tip_link: openarm_right_hand_tcp
    ramp_duration_sec: 2.0

left_gripper_controller:
  ros__parameters:
    joints:
      - openarm_left_finger_joint1
      - openarm_left_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Hold last commanded position after trajectory finishes (prevents auto-close)
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    goal_time: 5.0
    stopped_velocity_tolerance: 0.01

right_gripper_controller:
  ros__parameters:
    joints:
      - openarm_right_finger_joint1
      - openarm_right_finger_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Hold last commanded position after trajectory finishes (prevents auto-close)
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    goal_time: 5.0
    stopped_velocity_tolerance: 0.01

# "Motor 8" repurposed for amazing_hand: see left_hand_rotate_controller's
# declaration comment above. Same joint (openarm_<side>_finger_joint1), same
# real CAN motor as left_gripper_controller/right_gripper_controller above -
# only one of the two controller pairs is ever spawned at a time, gated by
# ee_type in the launch file.
left_hand_rotate_controller:
  ros__parameters:
    joints:
      - openarm_left_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    goal_time: 5.0
    stopped_velocity_tolerance: 0.01

right_hand_rotate_controller:
  ros__parameters:
    joints:
      - openarm_right_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    goal_time: 5.0
    stopped_velocity_tolerance: 0.01

# amazing_hand: j1<i> = yaw, j2<i> = flexion of finger i (i=1..3, 4=thumb).
# State interface is position-only (topic_based_ros2_control hardware, same
# as the standalone control_amazing_hand.launch.py setup).
left_hand_j1_controller:
  ros__parameters:
    joints: [openarm_left_j11, openarm_left_j12, openarm_left_j13, openarm_left_j14]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

left_hand_j2_controller:
  ros__parameters:
    joints: [openarm_left_j21, openarm_left_j22, openarm_left_j23, openarm_left_j24]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

right_hand_j1_controller:
  ros__parameters:
    joints: [openarm_right_j11, openarm_right_j12, openarm_right_j13, openarm_right_j14]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

right_hand_j2_controller:
  ros__parameters:
    joints: [openarm_right_j21, openarm_right_j22, openarm_right_j23, openarm_right_j24]
    command_interfaces: [position]
    state_interfaces: [position]
    allow_partial_joints_goal: true

head_controller:
  ros__parameters:
    joints: [openarm_body_neck_joint, openarm_body_head_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true

# --- CẤU HÌNH CHI TIẾT BASE CONTROLLER ---
base_controller:
  ros__parameters:
    # Tên các joint từ file Xacro
    left_wheel_names: ["openarm_base_left_drive_wheel_joint"]
    right_wheel_names: ["openarm_base_right_drive_wheel_joint"]

    publish_wheel_joint_state: true
    use_stamped_vel: false

    # Khai báo interface để controller gán vào phần cứng
    command_interfaces:
      - velocity
    state_interfaces:
      - velocity

    # Các thông số hình học (Cần đo đạc chính xác lại trên robot thật)
    wheel_separation: 0.45   # Khoảng cách tâm 2 bánh xe (mét)
    wheel_radius: 0.08       # Bán kính bánh xe (mét)

    # Hệ số điều chỉnh (để mặc định 1.0)
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Cấu hình Tọa độ và Odometry (TF)
    odom_frame_id: odom
    base_frame_id: openarm_base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.001]

    open_loop: false
    enable_odom_tf: true
    publish_limited_velocity: false

    cmd_vel_timeout: 0.5
    publish_rate: 50.0

    # Khớp nối chính xác với trạng thái interface từ URDF
    position_feedback: false
    velocity_feedback: true

    use_sim_time: true


