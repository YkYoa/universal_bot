<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenArm – Supervisor Logs</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<style>
  :root {
    --bg: #0f1115; --panel: #1b1e24; --panel2: #20232a;
    --line: rgba(255,255,255,0.10); --line2: rgba(255,255,255,0.06);
    --text: #e8e8e8; --dim: #6e7a89; --dim2: #9aa3ad;
    --active: #3a7bd5; --ok: #2ecc71;
    --error: #d9534f; --fatal: #a94442; --exception: #e2781a;
    --warn: #f59e0b;
    --special: #9b6dd6;
    --radius: 10px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100%;
  }

  /* nav.js sets padding-top via body.oa-nav-active */

  /* ── layout ─────────────────────────────────────────────────────── */
  .page-wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }

  .page-header { margin-bottom: 20px; }
  .page-header h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
    background: linear-gradient(135deg, #e8e8e8 0%, #9aa3ad 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .page-header p { color: var(--dim2); font-size: 13px; }

  /* ── toolbar ─────────────────────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 16px; box-sizing: border-box; max-width: 100%;
  }
  .toolbar-section {
    display: flex; align-items: center; gap: 6px;
    flex-wrap: wrap; min-width: 0;
  }
  .toolbar-section.node-section { flex: 1 1 auto; }
  .toolbar-sep { width: 1px; height: 22px; background: var(--line); flex: none; }
  .toolbar-label {
    font-size: 11px; color: var(--dim); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em; flex: none;
    margin-right: 2px;
  }

  .sev-chip {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
    border: 1px solid; cursor: pointer; transition: opacity .15s, background .15s;
    opacity: 0.4; background: transparent;
  }
  .sev-chip.on { opacity: 1; }
  .sev-chip.warn   { color: var(--warn);   border-color: var(--warn); }
  .sev-chip.error  { color: var(--error);  border-color: var(--error); }
  .sev-chip.fatal  { color: #ff9090; border-color: var(--fatal); }
  .sev-chip.on.warn   { background: rgba(245,158,11,0.15); }
  .sev-chip.on.error  { background: rgba(217,83,79,0.15); }
  .sev-chip.on.fatal  { background: rgba(169,68,66,0.15); }

  /* Node filter chips */
  .node-chip {
    display: inline-block;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 500;
    border: 1px solid var(--line); cursor: pointer;
    color: var(--dim2); background: transparent;
    transition: border-color .15s, color .15s, background .15s;
    opacity: 0.6; vertical-align: middle;
  }
  .node-chip:hover { opacity: 0.9; border-color: var(--dim2); }
  .node-chip.on {
    color: var(--special); border-color: var(--special);
    background: rgba(155,109,214,0.14); opacity: 1;
  }

  /* Live toggle */
  .live-toggle {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 12px; color: var(--dim2); padding: 4px 10px;
    border: 1px solid var(--line); border-radius: 999px;
    transition: border-color .15s, color .15s;
  }
  .live-toggle.on { color: var(--ok); border-color: var(--ok); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim); flex: none; transition: background .3s; }
  .live-toggle.on .live-dot { background: var(--ok);
    box-shadow: 0 0 5px var(--ok); animation: dot-pulse 1.8s ease-in-out infinite; }
  @keyframes dot-pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.4; }
  }
  .spacer { flex: 1 1 auto; }

  /* Load more */
  #loadMore {
    display: block; width: 100%; padding: 10px; margin-top: 12px;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; color: var(--dim2); font-size: 13px;
    cursor: pointer; text-align: center; transition: background .15s;
  }
  #loadMore:hover { background: #252830; color: var(--text); }
  #loadMore:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── log table ───────────────────────────────────────────────────── */
  #logContainer { display: grid; gap: 1px; }

  .date-group { margin-top: 16px; margin-bottom: 6px; }
  .date-group:first-child { margin-top: 0; }
  .date-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  .date-label::after { content: ''; flex: 1; height: 1px; background: var(--line2); width: 60px; }

  .log-row {
    display: grid;
    grid-template-columns: 80px 64px minmax(0,180px) 1fr;
    gap: 0 10px; align-items: baseline;
    padding: 7px 12px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line2);
    font-size: 12px; transition: background .1s;
  }
  .log-row:hover { background: var(--panel2); border-color: var(--line); }
  .log-row.fatal { border-left: 3px solid var(--fatal);
    animation: fatal-glow 3s ease-in-out infinite; }
  @keyframes fatal-glow {
    0%,100% { box-shadow: none; }
    50%      { box-shadow: inset 3px 0 8px rgba(169,68,66,0.25); }
  }
  .log-row.warn  { border-left: 3px solid var(--warn); }
  .log-row.error { border-left: 3px solid var(--error); }

  .log-ts { color: var(--dim); font-variant-numeric: tabular-nums;
    font-family: ui-monospace, 'Cascadia Code', monospace; }
  .log-badge {
    display: inline-block; padding: 1px 6px; border-radius: 3px;
    font-size: 10px; font-weight: 700; text-align: center;
  }
  .log-badge.WARN  { background: rgba(245,158,11,0.25); color: #fde68a; }
  .log-badge.ERROR { background: rgba(217,83,79,0.25); color: #ff9090; }
  .log-badge.FATAL { background: rgba(169,68,66,0.30); color: #ffb3b0; }
  .log-node {
    color: var(--special); font-size: 11px; font-family: ui-monospace, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .log-msg { color: var(--text); word-break: break-word; line-height: 1.4; }
  .log-msg .log-file { color: var(--dim); font-size: 10px; margin-left: 6px; }

  /* ── empty / status states ───────────────────────────────────────── */
  .state-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 40px 20px;
    text-align: center; color: var(--dim2);
  }
  .state-card .state-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.6; }
  .state-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .state-card p { font-size: 13px; max-width: 340px; margin: 0 auto; }

  /* ── file list sidebar ───────────────────────────────────────────── */
  .files-bar {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  .file-tag {
    padding: 3px 10px; border-radius: 6px; font-size: 11px;
    background: var(--panel2); border: 1px solid var(--line);
    color: var(--dim2); cursor: pointer; transition: border-color .15s, color .15s;
  }
  .file-tag:hover { border-color: var(--active); color: var(--text); }
  .file-tag.selected { border-color: var(--active); color: var(--active);
    background: rgba(58,123,214,0.12); }

  @media (max-width: 640px) {
    .log-row { grid-template-columns: 64px 50px 1fr; }
    .log-node { display: none; }
  }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="page-header">
    <h1>Supervisor Logs</h1>
    <p>Error and fatal messages from the robot control stack — captured from <code>/rosout</code> in real time.</p>
  </div>

  <!-- ── Toolbar ── -->
  <div class="toolbar">
    <div class="toolbar-section">
      <span class="toolbar-label">Severity</span>
      <button class="sev-chip warn on"  data-level="WARN"   id="chipWarn">WARN</button>
      <button class="sev-chip error on" data-level="ERROR"  id="chipError">ERROR</button>
      <button class="sev-chip fatal on" data-level="FATAL"  id="chipFatal">FATAL</button>
    </div>

    <div class="toolbar-sep"></div>

    <div class="toolbar-section node-section" id="nodeChips">
      <span class="toolbar-label">Node</span>
      <!-- populated by JS -->
    </div>

    <div class="spacer"></div>

    <button class="live-toggle" id="liveToggle" title="Auto-refresh every 10 s">
      <span class="live-dot"></span>
      <span id="liveLabel">Live off</span>
    </button>
  </div>

  <!-- ── Log file tabs ── -->
  <div class="files-bar" id="filesBar">
    <span style="color:var(--dim);font-size:12px">Loading log files…</span>
  </div>

  <!-- ── Log container ── -->
  <div id="logContainer">
    <div class="state-card" id="statusCard">
      <div class="state-icon">⏳</div>
      <h2>Loading…</h2>
      <p>Fetching supervisor logs from the robot.</p>
    </div>
  </div>

  <button id="loadMore" disabled style="display:none">Load older entries</button>
</div>

<script src="./vendor/socket.io/socket.io.min.js"></script>
<script src="./nav.js"></script>
<script>
(function () {
  'use strict';

  // ── state ──────────────────────────────────────────────────────────────
  var activeFilters = { WARN: true, ERROR: true, FATAL: true };
  var activeNodes = {};    // node name → true (empty = all nodes)
  var allEntries = [];     // master list (newest first)
  var selectedDate = null; // null = today/latest file
  var liveOn = false;
  var liveTimer = null;
  var lastTs = null;       // for incremental load when live
  var socket = null;

  var PAGE = 200;
  var visibleCount = PAGE;

  // ── DOM refs ───────────────────────────────────────────────────────────
  var logContainer = document.getElementById('logContainer');
  var statusCard   = document.getElementById('statusCard');
  var loadMoreBtn  = document.getElementById('loadMore');
  var filesBar     = document.getElementById('filesBar');
  var nodeChipsDiv = document.getElementById('nodeChips');
  var liveToggle   = document.getElementById('liveToggle');
  var liveLabel    = document.getElementById('liveLabel');

  // ── utilities ──────────────────────────────────────────────────────────
  function formatTs(tsStr) {
    if (!tsStr) return '—';
    // "2026-09-16T13:45:00.123Z" → "13:45:00.123"
    var t = tsStr.substring(11, 23);
    return t || tsStr;
  }

  function formatDate(tsStr) {
    if (!tsStr) return '—';
    return tsStr.substring(0, 10);
  }

  function shortNode(name) {
    if (!name) return '';
    var known = {
      'sequence_executor_node': 'seq_exec',
      'MoveItCppPlannerManager': 'planner',
      'robot_skills_node': 'skills',
      'robot_api_server': 'api',
      'qvic_fsm_node': 'qvic_fsm'
    };
    if (known[name]) return known[name];

    // Split hierarchical ROS2 logger / node paths (e.g. skills.moveit.moveit.planners.ompl.planning_context_manager)
    var parts = name.split(/[/.]+/).filter(Boolean);
    if (parts.length >= 2) {
      var leaf = parts[parts.length - 1];
      leaf = leaf.replace('_context_manager', '_context')
                 .replace('_execution_manager', '_exec');
      var subsystem = parts[parts.length - 2];
      if ((subsystem === 'planners' || subsystem === 'moveit') && parts.length >= 3) {
        subsystem = parts[parts.length - 3];
      }
      return subsystem + ':' + leaf;
    }
    return name;
  }

  // ── filtering ──────────────────────────────────────────────────────────
  function passes(entry) {
    if (!activeFilters[entry.level]) return false;
    var selectedNodes = Object.keys(activeNodes).filter(function (n) { return activeNodes[n]; });
    if (selectedNodes.length > 0) {
      var nodeMatch = false;
      selectedNodes.forEach(function (n) {
        if ((entry.node || '').includes(n)) nodeMatch = true;
      });
      if (!nodeMatch) return false;
    }
    return true;
  }

  function visibleEntries() {
    return allEntries.filter(passes);
  }

  // ── render ─────────────────────────────────────────────────────────────
  function buildRow(entry) {
    var row = document.createElement('div');
    row.className = 'log-row ' + (entry.level || '').toLowerCase();

    var ts = document.createElement('div');
    ts.className = 'log-ts';
    ts.textContent = formatTs(entry.ts);

    var badge = document.createElement('div');
    badge.className = 'log-badge ' + (entry.level || 'ERROR');
    badge.textContent = entry.level || 'ERROR';

    var node = document.createElement('div');
    node.className = 'log-node';
    node.textContent = shortNode(entry.node);
    node.title = entry.node || '';

    var msg = document.createElement('div');
    msg.className = 'log-msg';
    var msgText = document.createElement('span');
    msgText.textContent = entry.msg || '';
    msg.appendChild(msgText);
    if (entry.file) {
      var fileSpan = document.createElement('span');
      fileSpan.className = 'log-file';
      fileSpan.textContent = entry.file + (entry.line ? ':' + entry.line : '');
      msg.appendChild(fileSpan);
    }

    row.appendChild(ts);
    row.appendChild(badge);
    row.appendChild(node);
    row.appendChild(msg);
    return row;
  }

  function renderLogs() {
    // Remove old rows (but keep the status card reference)
    var existing = logContainer.querySelectorAll('.log-row,.date-group');
    existing.forEach(function (el) { el.remove(); });
    statusCard.style.display = 'none';
    loadMoreBtn.style.display = 'none';

    var filtered = visibleEntries();

    if (filtered.length === 0) {
      statusCard.style.display = '';
      statusCard.innerHTML = [
        '<div class="state-icon">🔕</div>',
        '<h2>No logs yet</h2>',
        '<p>The robot hasn\'t produced any WARN, ERROR or FATAL messages today. ' +
        'Logs appear here as soon as the supervisor emits them.</p>'
      ].join('');
      return;
    }

    var shown = filtered.slice(0, visibleCount);
    var currentDate = null;

    shown.forEach(function (entry) {
      var entryDate = formatDate(entry.ts);
      if (entryDate !== currentDate) {
        currentDate = entryDate;
        var grp = document.createElement('div');
        grp.className = 'date-group';
        var lbl = document.createElement('div');
        lbl.className = 'date-label';
        lbl.textContent = entryDate;
        grp.appendChild(lbl);
        logContainer.appendChild(grp);
      }
      logContainer.appendChild(buildRow(entry));
    });

    if (filtered.length > visibleCount) {
      loadMoreBtn.style.display = '';
      loadMoreBtn.disabled = false;
      loadMoreBtn.textContent = 'Load older entries (' + (filtered.length - visibleCount) + ' more)';
    }
  }

  function buildNodeChips(entries) {
    var nodes = {};
    entries.forEach(function (e) { if (e.node) nodes[e.node] = true; });
    nodeChipsDiv.innerHTML = '<span class="toolbar-label">Node</span>';
    var nodeNames = Object.keys(nodes).sort();
    if (nodeNames.length === 0) {
      var emptySpan = document.createElement('span');
      emptySpan.style.color = 'var(--dim)';
      emptySpan.style.fontSize = '11px';
      emptySpan.textContent = 'None';
      nodeChipsDiv.appendChild(emptySpan);
      return;
    }
    nodeNames.forEach(function (name) {
      var chip = document.createElement('button');
      var isSelected = !!activeNodes[name];
      chip.className = 'node-chip' + (isSelected ? ' on' : '');
      chip.textContent = shortNode(name);
      chip.title = name;
      chip.dataset.node = name;
      chip.addEventListener('click', function () {
        activeNodes[name] = !activeNodes[name];
        chip.classList.toggle('on', activeNodes[name]);
        visibleCount = PAGE;
        renderLogs();
      });
      nodeChipsDiv.appendChild(chip);
    });
  }

  // ── data fetching ──────────────────────────────────────────────────────
  function fetchLogs(params) {
    var qs = Object.keys(params || {}).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
    }).join('&');
    return fetch('/api/logs' + (qs ? '?' + qs : ''))
      .then(function (r) { return r.json(); });
  }

  function fetchFiles() {
    return fetch('/api/logs/files').then(function (r) { return r.json(); });
  }

  function loadAll() {
    statusCard.style.display = '';
    statusCard.innerHTML = '<div class="state-icon">⏳</div><h2>Loading…</h2><p>Fetching logs from the robot.</p>';

    var params = { limit: 1000 };
    if (selectedDate) params.date = selectedDate;

    fetchLogs(params).then(function (res) {
      if (!res.success) throw new Error(res.message || 'fetch failed');
      allEntries = res.entries || [];
      if (allEntries.length > 0) lastTs = allEntries[0].ts;
      buildNodeChips(allEntries);
      visibleCount = PAGE;
      renderLogs();
    }).catch(function (err) {
      statusCard.style.display = '';
      statusCard.innerHTML = [
        '<div class="state-icon">⚠️</div>',
        '<h2>Could not load logs</h2>',
        '<p>' + err.message + '</p>'
      ].join('');
    });
  }

  function loadFilesBar() {
    fetchFiles().then(function (res) {
      if (!res.success || !res.files || res.files.length === 0) {
        filesBar.innerHTML = '<span style="color:var(--dim);font-size:12px">No log files yet.</span>';
        return;
      }
      filesBar.innerHTML = '';
      res.files.forEach(function (f, i) {
        var tag = document.createElement('button');
        tag.className = 'file-tag' + (i === 0 ? ' selected' : '');
        var kb = Math.round(f.size / 1024);
        tag.textContent = f.date + ' (' + kb + ' KB)';
        tag.title = f.file;
        tag.dataset.date = f.date;
        if (i === 0) { selectedDate = f.date; }
        tag.addEventListener('click', function () {
          filesBar.querySelectorAll('.file-tag').forEach(function (t) { t.classList.remove('selected'); });
          tag.classList.add('selected');
          selectedDate = f.date;
          allEntries = [];
          visibleCount = PAGE;
          loadAll();
        });
        filesBar.appendChild(tag);
      });
    }).catch(function () {
      filesBar.innerHTML = '<span style="color:var(--dim);font-size:12px">Could not list log files.</span>';
    });
  }

  // ── live mode ──────────────────────────────────────────────────────────
  function appendNewEntries(entries) {
    if (!entries || entries.length === 0) return;
    // entries are newest-first — prepend to allEntries
    allEntries = entries.concat(allEntries);
    lastTs = entries[0].ts;
    // Don't reset visibleCount so user keeps their scroll position
    renderLogs();
  }

  function pollNew() {
    var params = { limit: 100 };
    if (lastTs) params.since = lastTs;
    fetchLogs(params).then(function (res) {
      if (res.success && res.entries && res.entries.length > 0) {
        appendNewEntries(res.entries);
      }
    }).catch(function () { /* silent */ });
  }

  function startLive() {
    liveOn = true;
    liveToggle.classList.add('on');
    liveLabel.textContent = 'Live on';
    // Use WebSocket for real-time if available
    if (socket) {
      socket.on('log_event', function (entry) { appendNewEntries([entry]); });
    }
    // Also poll every 10s as fallback / catch-up
    liveTimer = setInterval(pollNew, 10000);
  }

  function stopLive() {
    liveOn = false;
    liveToggle.classList.remove('on');
    liveLabel.textContent = 'Live off';
    if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    if (socket) { socket.off('log_event'); }
  }

  liveToggle.addEventListener('click', function () {
    if (liveOn) { stopLive(); } else { startLive(); }
  });

  // ── severity chips ─────────────────────────────────────────────────────
  document.querySelectorAll('.sev-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      var lvl = chip.dataset.level;
      activeFilters[lvl] = !activeFilters[lvl];
      chip.classList.toggle('on', activeFilters[lvl]);
      visibleCount = PAGE;
      renderLogs();
    });
  });

  // ── load more ──────────────────────────────────────────────────────────
  loadMoreBtn.addEventListener('click', function () {
    visibleCount += PAGE;
    renderLogs();
  });

  // ── socket for live events ─────────────────────────────────────────────
  try {
    socket = io();
    if (window.oaNav) window.oaNav.setSocket(socket);
  } catch (e) { /* socket.io not available */ }

  // ── init ───────────────────────────────────────────────────────────────
  loadFilesBar();
  loadAll();

})();
</script>
</body>
</html>
