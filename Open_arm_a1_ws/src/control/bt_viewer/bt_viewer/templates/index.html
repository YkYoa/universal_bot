<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenArm Sequence Executor Viewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cytoscape.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        #cy {
            width: 100%;
            height: 100%;
            background-color: #f8fafc;
        }
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }
        .pulse-glowing {
            animation: pulse 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

    <!-- Top Navbar -->
    <header class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-network-wired text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    OpenArm <span class="text-blue-500 font-medium">Sequence Viewer</span>
                </h1>
                <p class="text-xs text-slate-400">sequence_executor live telemetry</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Connection Status -->
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs">
                <span id="conn-indicator" class="h-2 w-2 rounded-full bg-red-500"></span>
                <span id="conn-text" class="font-medium text-slate-300">Disconnected</span>
            </div>
            <!-- Overall BT status -->
            <div class="flex items-center gap-2 px-4 py-1.5 rounded-lg bg-slate-900 border border-slate-800">
                <span class="text-xs text-slate-400">Engine Status:</span>
                <span id="overall-status" class="text-xs font-bold px-2 py-0.5 rounded uppercase bg-slate-800 text-slate-300">IDLE</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex flex-1 overflow-hidden">
        <!-- Left: Cytoscape Graph Area -->
        <section class="flex-1 relative flex flex-col border-r border-slate-800">
            <div class="absolute top-4 left-4 z-10 flex gap-2">
                <button onclick="resetGraphView()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-1.5 shadow-lg transition">
                    <i class="fa-solid fa-arrows-to-eye"></i> Fit view
                </button>
                <button onclick="reloadTreeStructure()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-700 text-xs flex items-center gap-1.5 shadow-lg transition">
                    <i class="fa-solid fa-arrows-rotate"></i> Reload sequence.yaml
                </button>
            </div>
            
            <div class="absolute top-4 right-4 z-10 flex flex-col gap-1.5 bg-slate-950/90 border border-slate-800 rounded-lg p-3 text-xs shadow-lg backdrop-blur">
                <div class="font-semibold text-slate-300 mb-1 border-b border-slate-800 pb-1">Legend</div>
                <div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded bg-[#3b82f6]"></span> Running</div>
                <div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded bg-[#10b981]"></span> Success</div>
                <div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded bg-[#ef4444]"></span> Failure</div>
                <div class="flex items-center gap-2"><span class="h-2.5 w-2.5 rounded bg-[#e2e8f0] border border-slate-400"></span> Idle / Ready</div>
            </div>

            <!-- Graph Canvas -->
            <div id="cy" class="flex-1"></div>
        </section>

        <!-- Right: telemetry -->
        <section class="w-96 bg-slate-950 flex flex-col h-full shrink-0 overflow-hidden">
            <div class="flex border-b border-slate-800 text-sm font-medium shrink-0 bg-slate-950">
                <div class="flex-1 py-3 px-4 border-b-2 border-blue-500 text-blue-500 flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-terminal"></i> Log Stream
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-4 flex flex-col min-h-0">
                <div class="flex flex-col flex-1 min-h-0 space-y-2">
                    <div class="flex justify-between items-center shrink-0">
                        <h3 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Status &amp; Fault Events</h3>
                        <button onclick="clearLogs()" class="text-[10px] text-red-400 hover:text-red-300 hover:underline uppercase">Clear</button>
                    </div>
                    <div id="log-terminal" class="flex-1 bg-slate-900 border border-slate-800 rounded-lg p-3 font-mono text-[10px] overflow-y-auto space-y-1.5 text-emerald-400 leading-relaxed scrollbar-thin">
                        <div class="text-slate-500">Waiting for sequence_executor telemetry...</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- JS Scripts -->
    <script>
        let cy = null;
        let socket = null;

        // Connect socket
        function initSocket() {
            socket = io();

            socket.on('connect', () => {
                document.getElementById('conn-indicator').className = 'h-2 w-2 rounded-full bg-emerald-500';
                document.getElementById('conn-text').textContent = 'Connected';
                document.getElementById('conn-text').className = 'font-medium text-emerald-400';
            });

            socket.on('disconnect', () => {
                document.getElementById('conn-indicator').className = 'h-2 w-2 rounded-full bg-red-500';
                document.getElementById('conn-text').textContent = 'Disconnected';
                document.getElementById('conn-text').className = 'font-medium text-slate-300';
            });

            // sequence_executor publishes whole-sequence status, not
            // per-node transitions like BT.CPP did - every node in the
            // tree is highlighted with the same overall status.
            socket.on('tree_status', (data) => {
                const badge = document.getElementById('overall-status');
                badge.textContent = data.status;
                badge.className = 'text-xs font-bold px-2 py-0.5 rounded uppercase ' + getStatusClass(data.status);
                updateAllNodesStatus(data.status);
            });

            socket.on('log_line', (data) => {
                appendLog(data);
            });
        }

        // Color mapper for overall status
        function getStatusClass(status) {
            switch(status) {
                case 'RUNNING': return 'bg-blue-900/50 text-blue-300 border border-blue-700';
                case 'SUCCESS': return 'bg-emerald-900/50 text-emerald-300 border border-emerald-700';
                case 'FAILURE': return 'bg-red-900/50 text-red-300 border border-red-700';
                default:        return 'bg-slate-800 text-slate-300 border border-slate-700';
            }
        }

        // Logs terminal - sequence_executor's ~/status and ~/fault text,
        // as plain strings (not per-node BT transitions).
        function appendLog(data) {
            const term = document.getElementById('log-terminal');
            const timeStr = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');

            const color = data.level === 'fault' ? 'text-red-400' : 'text-emerald-400';
            logLine.innerHTML = `
                <span class="text-slate-500">[${timeStr}]</span>
                <span class="${color} font-bold">${data.text}</span>
            `;
            term.appendChild(logLine);
            term.scrollTop = term.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('log-terminal').innerHTML = '<div class="text-slate-500">Logs cleared. Logging transitions...</div>';
        }

        // Fetch the sequence structure (built from sequence.yaml server-side)
        // and render it with Cytoscape.
        function reloadTreeStructure() {
            fetch('/api/tree')
                .then(res => res.json())
                .then(treeData => {
                    if (!treeData || treeData.error) {
                        console.error("Failed to load sequence structure:", treeData && treeData.error);
                        return;
                    }
                    renderCytoscape(treeData);
                })
                .catch(err => {
                    console.error("Error loading sequence structure:", err);
                    alert("Failed to load sequence structure. Make sure sequence_yaml_path/sequence_name params are set.");
                });
        }

        // Render tree structure in Cytoscape.js
        function renderCytoscape(treeNode) {
            const elements = [];
            
            // Build Cytoscape nodes and edges recursively
            function parseElements(node, parentId = null) {
                // Status comes embedded from the server (whole-sequence
                // status, same for every node - see build_sequence_tree).
                const status = node.status || 'IDLE';

                // Determine node classification
                let nodeClass = 'unknown';
                if (['Sequence', 'ReactiveSequence'].includes(node.type)) {
                    nodeClass = 'sequence';
                } else if (['Fallback'].includes(node.type)) {
                    nodeClass = 'fallback';
                } else if (['Inverter', 'RetryUntilSuccessful', 'ForceSuccess'].includes(node.type)) {
                    nodeClass = 'decorator';
                } else if (node.type.startsWith('Is') || node.type.includes('Condition')) {
                    nodeClass = 'condition';
                } else {
                    nodeClass = 'action';
                }

                // Push current node
                elements.push({
                    data: {
                        id: node.id,
                        label: node.name,
                        type: node.type,
                        status: status
                    },
                    classes: `${nodeClass} ${status.toLowerCase()}`
                });

                // Push edge to parent
                if (parentId) {
                    elements.push({
                        data: {
                            id: `edge_${parentId}_${node.id}`,
                            source: parentId,
                            target: node.id
                        }
                    });
                }

                // Traverse children
                if (node.children) {
                    node.children.forEach(child => {
                        parseElements(child, node.id);
                    });
                }
            }

            parseElements(treeNode);

            // Initialize cytoscape
            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(label)',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'font-size': '10px',
                            'color': '#334155',
                            'background-color': '#e2e8f0',
                            'border-width': '2px',
                            'border-color': '#64748b',
                            'width': '120px',
                            'height': '36px',
                            'transition-property': 'background-color, border-color, color, line-color, target-arrow-color',
                            'transition-duration': '0.3s'
                        }
                    },
                    {
                        selector: 'node.sequence',
                        style: {
                            'shape': 'round-rectangle',
                            'background-color': '#cbd5e1',
                            'border-color': '#475569',
                            'color': '#0f172a',
                            'font-weight': 'bold',
                            'width': '90px'
                        }
                    },
                    {
                        selector: 'node.fallback',
                        style: {
                            'shape': 'round-rectangle',
                            'background-color': '#fca5a5',
                            'border-color': '#dc2626',
                            'color': '#7f1d1d',
                            'font-weight': 'bold',
                            'width': '90px'
                        }
                    },
                    {
                        selector: 'node.decorator',
                        style: {
                            'shape': 'diamond',
                            'background-color': '#fed7aa',
                            'border-color': '#ea580c',
                            'color': '#7c2d12',
                            'width': '70px',
                            'height': '46px',
                            'font-size': '8px'
                        }
                    },
                    {
                        selector: 'node.condition',
                        style: {
                            'shape': 'ellipse',
                            'background-color': '#fef08a',
                            'border-color': '#ca8a04',
                            'color': '#713f12',
                            'width': '100px'
                        }
                    },
                    {
                        selector: 'node.action',
                        style: {
                            'shape': 'rectangle',
                            'background-color': '#bfdbfe',
                            'border-color': '#2563eb',
                            'color': '#1e3a8a',
                            'width': '110px'
                        }
                    },
                    // Status style classes override colors
                    {
                        selector: 'node.idle',
                        style: {
                            'color': '#475569'
                        }
                    },
                    {
                        selector: 'node.running',
                        style: {
                            'background-color': '#3b82f6',
                            'border-color': '#1d4ed8',
                            'color': '#ffffff'
                        }
                    },
                    {
                        selector: 'node.success',
                        style: {
                            'background-color': '#10b981',
                            'border-color': '#047857',
                            'color': '#ffffff'
                        }
                    },
                    {
                        selector: 'node.failure',
                        style: {
                            'background-color': '#ef4444',
                            'border-color': '#b91c1c',
                            'color': '#ffffff'
                        }
                    },
                    // Edge Styling
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#cbd5e1',
                            'target-arrow-color': '#cbd5e1',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier'
                        }
                    }
                ],
                layout: {
                    name: 'breadthfirst',
                    directed: true,
                    padding: 40,
                    animate: true,
                    animationDuration: 500
                }
            });
        }

        // sequence_executor reports whole-sequence status, not per-node
        // transitions - highlight every node in the tree the same way.
        function updateAllNodesStatus(status) {
            if (!cy) return;
            cy.nodes().forEach(node => {
                node.data('status', status);
                node.removeClass('idle running success failure');
                node.addClass(status.toLowerCase());
            });
        }

        function resetGraphView() {
            if (cy) {
                cy.fit();
                cy.center();
            }
        }

        // Initialization
        window.addEventListener('DOMContentLoaded', () => {
            initSocket();
            reloadTreeStructure();
        });
    </script>
</body>
</html>
