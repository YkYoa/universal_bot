controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # ── FUTURE CONTROLLER OPTIONS (STUBS FOR FORCE & VELOCITY CONTROL) ────────
    # Uncomment and configure these as needed for your application.
    # Note: To use these, your hardware interface (URDF/hardware_interface) 
    # must export the corresponding command_interfaces ("velocity", "effort", etc.).
    
    # 1. Velocity Controller (e.g. for VLA real-time streaming joint velocities)
    # left_arm_velocity_controller:
    #   type: velocity_controllers/JointGroupVelocityController

    # 2. Force/Admittance Controller (for compliance & force-controlled actions)
    # left_arm_admittance_controller:
    #   type: admittance_controller/AdmittanceController

left_arm_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_gripper_controller:
  ros__parameters:
    joints:
      - openarm_left_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_gripper_controller:
  ros__parameters:
    joints:
      - openarm_right_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

