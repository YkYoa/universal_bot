# sequences.yaml
# Concise format for defining robot sequences.
#
# Global speeds definition
# speed:
#   <sequence_name>: [speed_step1, speed_step2, ...]
#
# <sequence_name>Poses:
#   <step_name>: [values...]
#
# Naming convention for step_name:
# Prefix determines the arm:
#   la* -> left_arm
#   ra* -> right_arm
#   ba* -> both_arms
#   grip* -> grippers
#
# Value formats:
#   Joints: [J1, J2, J3, J4, J5, J6, J7] (assumed DEGREES, will be auto-converted to radians)
#   Pose:   [x, y, z, qx, qy, qz, qw]    (x,y,z in meters, q in quaternion)
#   Named:  "home" or "ready"
#   Gripper: "open" or "close" or [position_in_meters]

speed:
  wave: [0.5, 1.0, 1.0, 1.0, 1.0, 0.3]
  greet: [1.0, 1.0, 1.0, 1.0]
  home_both: [0.3, 0.3]
  ready_both: [0.3, 0.3]
  open_grippers: [1.0, 1.0]
  close_grippers: [1.0, 1.0]

wavePoses:
  raReady: "ready"
  raWaves_1: [0.0964, 0.6559, 1.4986, -0.2359, -0.0001, 0.0000, 0.9718]

greetPoses:
  laGreet_1: [-28.95, -74.73, -4.25, 135.67, 0.00, -0.17, 0.01]

home_bothPoses:
  laHome: "home"
  raHome: "home"

ready_bothPoses:
  laReady: "ready"
  raReady: "ready"

open_grippersPoses:
  gripLeft: "open"
  gripRight: "open"

close_grippersPoses:
  gripLeft: "close"
  gripRight: "close"
