# key-rule: 

#   Planning group indicator:
#     If the key start with:
#       la/ra: arm goal
#       lh/rh: hand goal
#       head: head goal

#   Pose or Joint-angle-vector:
#     Key name contain Angle or Joint
#       If Angle > joint-angle-vector
#       If Joint > pose data: 3 position and 4 quarternion follow  
#       Can auto detect radian or degree

# speed scale factor

speed: 
  home: 1, 1, 1, 1, 1, 1, 1

homePoses:
  headHome: 0
  laHomeAngle: 0.00782025, -0.018883, 0.0444419, 0.110437, -0.0307088, -0.0593194, 0.058175
  raHomeAngle: 0, 0, 0, 0, 0, 0, 0

graspPoses: 
  laPreGraspAngle: 0, 0, 0, 0, 0, 0, 90
  raPreGraspAngle: 0, 0, 0, 0, 0, 0, -90

wavePoses:
  laPreWaveJoint: 0.34236, 0.32436, 1.33896, 0.00304, 0.07106, 0.99352, -0.08869
  laEndWaveJoint: 0.34085, 0.13239, 1.31470, 0.02744, -0.12550, 0.98132, 0.14323
  # laWave1Joint: 0.34236, 0.42436, 1.33896, 0.00304, 0.07106, 0.99352, -0.08869
  # laWave2Joint: 0.34236, 0.22436, 1.33896, 0.00304, 0.07106, 0.99352, -0.08869
  # laPreWaveAngle: 0, -30, 0, -60, 0, 30, 0
  # laWave1Angle: 0, -30, 0, -60, -20, 30, 0
  # laWave2Angle: 0, -30, 0, -60, 20, 30, 0

greetPoses:
  laPreGreetJoint: 0.40, 0.20, 1.10, 0.0, -0.7071, 0.0, 0.7071
