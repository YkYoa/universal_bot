# key-rule: 

#   Planning group indicator:
#     If the key start with:
#       la/ra: arm goal
#       lh/rh: hand goal
#       head: head goal

#   Pose or Joint-angle-vector:
#     Key name contain Angle or Joint
#       If Angle > joint-angle-vector
#       If Joint > pose data: 3 position and 4 quarternion follow  
#       Can auto detect radian or degree

# speed scale factor

speed: 
  home: 1, 1, 1, 1, 1, 1, 1

homePoses:
  headHome: 0

graspPoses: 
  laPreGraspAngle: 0, 0, 0, 0, 0, 0, 90
  raPreGraspAngle: 0, 0, 0, 0, 0, 0, -90

wavePoses:
  laPreWaveJoint:  

greetPoses:
  laPreGreetJoint: 