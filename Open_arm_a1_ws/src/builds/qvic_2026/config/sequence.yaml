# Fully-open amazing_hand flex pose (fingers extended) - paired with
# homePoses' lh/rhHomeFlex (curled) by the hand_open_close sequence below to
# cycle open<->close. No yaw keys here on purpose: only flex changes during
# the cycle, yaw stays wherever homePoses' home step left it.
handOpen:
  lhOpenFlex: 0, 0, 0, 0
  rhOpenFlex: 0, 0, 0, 0

# sequences: - sequence_executor reads this directly (no XML generation
# step). Each entry is a flat set of fields, same style as every other
# section here - see sequence_executor/include/sequence_executor/
# sequence_yaml.hpp for the exact field meanings.
sequences:
  qvic_2026_left:
    arm: left_arm
    planner_profile: fast_ptp
    body_section: waveEllipse

  qvic_2026_right:
    arm: right_arm
    planner_profile: fast_ptp
    body_section: waveEllipseR

  qvic_2026_both:
    arm: both_arms
    planner_profile: realtime_rrt
    home_section: homePoses
    body_section: waveEllipse
    body_right_section: waveEllipseR
    repeat: -1

  qvic_2026_wavepose_bimanual:
    arm: both_arms
    planner_profile: realtime_rrt
    home_section: waveHome
    body_section: wavePoses
    body_right_section: wavePosesR
    repeat: -1
    # KNOWN ISSUE (pre-existing, not caused by the sequence_executor migration):
    # wavePoses/wavePosesR interleaved has more than one problematic point
    # (planning failed at point 7, then point 6 after excluding 7) - needs a
    # proper pass with check_bimanual_collision before this sequence is
    # trustworthy end-to-end. exclude_points: <N>[, <N>...] is supported
    # (1-indexed) once the actual offending point(s) are identified.

  hand_open_close:
    arm: both_arms
    home_section: homePoses
    body_sections: handOpen, homePoses
    repeat: -1

