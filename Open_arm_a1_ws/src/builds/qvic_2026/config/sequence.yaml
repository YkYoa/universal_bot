# key-rule: (same convention as builds/openarm_demo/config/sequence.yaml)

#   Planning group indicator:
#     If the key start with:
#       la/ra: arm goal
#       lh/rh: hand goal
#       head: head goal

#   Pose or Joint-angle-vector:
#     Key name contain Angle or Joint
#       If Angle > joint-angle-vector (recorded via `record_waypoint`, replayed via PlanToJointTarget)
#       If Joint > pose data: 3 position and 4 quarternion follow
#       Can auto detect radian or degree

# speed: <section>: <velocity>[, <acceleration>] - MoveIt velocity_scaling /
# acceleration_scaling factors [0-1] applied to every waypoint in that
# section (both PlanToJointTarget and PlanToPose). Missing or 0 = skill's
# default profile value. One pair per section, not per joint - MoveIt scales
# the whole trajectory uniformly. acceleration is optional (velocity alone
# is fine: "home: 1.0").

speed:
  home: 1.0, 1.0
  wavePoses: 1.0, 1.0
  talkingPoses: 1.0, 1.0

# Record waypoints here with, e.g.:
#   ros2 run openarm_demo record_waypoint --arm la --section homePoses --name Home \
#     --file $(ros2 pkg prefix qvic_2026)/share/qvic_2026/config/sequence.yaml
# (or point --file at this file directly under src/ if editing the source copy)

homePoses:
  laHomeAngle: 0, 0, 0, 0, 1.5701, 0, 0
  raHomeAngle: 0, 0, 0, 0, -1.5700, 0, 0
  lhHomeYaw: 0.0000, -0.0001, -0.0001, 0.0001
  lhHomeFlex: -0.0079, 0.0026, 1.2186, 1.2133
  rhHomeYaw: -0.0001, 0.0001, -0.0001, -0.0001
  rhHomeFlex: 0.0001, 0.0053, 1.2212, 1.2186

# Reference Cartesian poses (x, y, z, qx, qy, qz, qw), same values as
# builds/openarm_demo/config/sequence.yaml - used directly (no FK) as
# --start/--end for trajectory_waypoint_generator.
waveRefs:
  # Original hand-picked references. Kept for trajectory_waypoint_generator,
  # which used them to generate the waveEllipse/waveEllipseR sections. Do NOT
  # use them as Cartesian goals: their orientations are right but their
  # positions are ~8cm from where the arm actually ends up.
  laPreWaveJoint: 0.34236, 0.32436, 1.33896, 0.00304, 0.07106, 0.99352, -0.08869
  laEndWaveJoint: 0.34085, 0.13239, 1.31470, 0.02744, -0.12550, 0.98132, 0.14323

  # Where the arms actually go: forward kinematics of the first and last
  # waypoints of waveEllipse / waveEllipseR, in the openarm_base_link frame.
  # These are what builtin action_02 sweeps its ellipse between, so the arc
  # starts and ends exactly where the joint data already proves reachable.
  # Regenerate after re-recording an arc section - see the qvic_2026 README.
  laWaveStartPose: 0.316780, 0.285397, 1.269007, 0.003040, 0.071060, 0.993517, -0.088690
  laWaveEndPose: 0.303303, 0.137889, 1.239694, 0.027440, -0.125500, 0.981317, 0.143230
  raWaveStartPose: 0.316781, -0.285397, 1.269007, 0.071060, 0.003036, -0.088636, 0.993521
  raWaveEndPose: 0.307944, -0.136692, 1.239663, -0.115797, 0.026269, 0.131825, 0.984136

