# key-rule (same convention as builds/openarm_demo/config/sequence.yaml):
#
#   Planning group indicator:
#     If the key starts with:
#       head: head goal (openarm_body_neck_joint, openarm_body_head_joint)
#       lh/rh: hand goal (left_hand_fingers / right_hand_fingers, 8 joints:
#              j11, j12, j13, j14, j21, j22, j23, j24)
#
#   Pose or Joint-angle-vector:
#     Key name contains Angle or Joint
#       If Angle -> joint-angle-vector
#       If Joint -> pose data: 3 position + 4 quaternion
#
# Hand open/close/home are handled via SRDF named poses (move_to_named_pose
# skill, group=left_hand_fingers/right_hand_fingers, named_pose=open/close/home)
# rather than raw angle vectors here, since those are already defined in
# openarm_bimanual.srdf. Raw hand joint waypoints can still be added below
# with an lh/rhAngle-suffixed key if a custom finger pose is ever needed.

homePoses:
  headHome: 0, 0
