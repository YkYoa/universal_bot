# Reference tunables for gesture_teleop_node - matches the constants
# currently hardcoded at the top of teleop_node.py (DEFAULT_MAX_VELOCITY
# etc). Not yet wired via declare_parameter/get_parameter (that's a
# follow-up once these are being tuned against the real robot rather than
# just documented) - keep this file and those constants in sync by hand
# until then.
gesture_teleop_node:
  ros__parameters:
    mirror_mode: "mirror"          # "mirror" | "same_side" - see core/frames.py

    # Rate-limiter caps (plan Stage 6 starting point) - deliberately NOT
    # robot_hardware_interface/config/joint_limits.yaml's max_jerk, which
    # that file itself documents as a placeholder (1000.0), not a real
    # limit. Raise these only after watching the five disengage-path
    # demonstrations in the plan's Stage 6 gate hold up at the current
    # values.
    max_joint_velocity: 0.2        # rad/s
    max_joint_acceleration: 0.5    # rad/s^2
    max_joint_jerk: 10.0           # rad/s^3

    dead_man_timeout_s: 0.15       # plan interlock 3
    hold_timeout_s: 0.5            # plan interlock 13 (HOLD -> DISENGAGED)

    udp_host: "127.0.0.1"
    udp_port: 5056                 # must match mock_server.py's --udp-port
