# =============================================================================
# Docker Compose for OpenArm RViz2 UI (WSL2 + WSLg)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.wsl.yml up -d --build
#   docker exec -it openarm_wsl_ui bash
# =============================================================================

services:
  openarm_wsl_ui:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.wsl
      args:
        - USER_UID=1000
        - USER_GID=1000
    image: openarm-wsl-ui:jazzy
    container_name: openarm_wsl_ui

    environment:
      # --- Display (WSLg provides both X11 and Wayland) ---
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=${PULSE_SERVER:-/mnt/wslg/PulseServer}
      # --- OpenGL / RViz rendering ---
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      # --- ROS 2 DDS (match this with Hans's robot network if needed) ---
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    volumes:
      # X11 socket (WSLg)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # WSLg runtime (Wayland + PulseAudio)
      - /mnt/wslg:/mnt/wslg:rw
      # Mount the workspace source — edits in Windows/VSCode show up instantly
      - ../src:/home/ros/ws/src:rw

    devices:
      # Hardware acceleration for RViz2
      - /dev/dri:/dev/dri

    # host networking = container shares the WSL network stack.
    # This means ROS 2 DDS multicast works out of the box between
    # the container and any other ROS nodes on the same network.
    network_mode: host
    ipc: host
    privileged: true

    # Keep container alive
    stdin_open: true
    tty: true
