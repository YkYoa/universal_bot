name: Deploy to Robot

on:
  push:
    branches: [ master ]
    paths:
      - 'Open_arm_a1_ws/src/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 1. Connect to Tailscale (since robot is on 100.x.x.x Tailscale IP)
      # Required GitHub Secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # 2. Setup SSH Key for password-less access to robot
      # Required GitHub Secret: ROBOT_SSH_KEY (private key content)
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.ROBOT_SSH_KEY }}
          known_hosts: unnecessary
          config: |
            Host robot
              HostName 100.92.66.138
              User ubuntu
              StrictHostKeyChecking no

      # 3. Sync source code to robot
      - name: Sync source to robot
        run: |
          rsync -avz --delete \
            --exclude 'build/' \
            --exclude 'install/' \
            --exclude 'log/' \
            --exclude '.git/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./Open_arm_a1_ws/src/ ubuntu@100.92.66.138:~/arm_ws/src/

      # 4. Build on robot
      - name: Build on robot
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@100.92.66.138 \
            "bash -ic 'cd ~/arm_ws && colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release'"

      # 5. Notify result
      - name: Report success
        if: success()
        run: echo "✅ Deploy and build successful on robot!"
      
      - name: Report failure
        if: failure()
        run: echo "❌ Deploy or build failed!"
